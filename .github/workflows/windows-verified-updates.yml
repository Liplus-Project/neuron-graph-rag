name: Windows verified updates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-updates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP extra
        run: python -m pip install --disable-pip-version-check -e '.[mcp]'
      - name: Check release, download, and live tray paths
        run: python -m unittest tests.test_verified_updates tests.test_mcp_adapter.MCPSharedProxyTest.test_tray_stop_latches_until_resume -v
