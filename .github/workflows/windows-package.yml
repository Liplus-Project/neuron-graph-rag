name: Windows package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_artifacts:
        description: Upload the reviewed CPU and CUDA installers
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Windows package (${{ matrix.flavor }})
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # The bundled DLLs and published runtime terms are from Visual Studio 2022.
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu, cuda]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Visual Studio Community 2022 VC redistributables
        shell: pwsh
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_community_2022.exe'
          Invoke-WebRequest 'https://aka.ms/vs/17/release/vs_community.exe' -OutFile $bootstrapper
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'Visual Studio Community bootstrapper signature is not valid Microsoft code'
          }
          $installRoot = Join-Path ${env:ProgramFiles} 'Microsoft Visual Studio\2022\Community'
          $arguments = @('--installPath', "`"$installRoot`"", '--add', 'Microsoft.VisualStudio.Component.VC.Redist.14.Latest',
                         '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '--quiet', '--wait', '--norestart')
          $process = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode) { throw "Visual Studio Community installation failed: $($process.ExitCode)" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $found = & $vswhere -latest -products Microsoft.VisualStudio.Product.Community -property installationPath
          if ($LASTEXITCODE -or $found -ne $installRoot) { throw 'Visual Studio Community installation was not registered at the expected path' }
          "NGR_VC_REDIST_INSTALLATION=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build frozen package and per-user installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Flavor '${{ matrix.flavor }}'
      - name: Check pinned NumPy and shortlist paths
        shell: pwsh
        run: |
          python -c "import numpy as np; assert np.__version__ == '1.26.4'; assert np.linalg.norm(np.array([3.0, 4.0])) == 5.0"
          if ($LASTEXITCODE) { throw 'NumPy runtime check failed' }
          python -m unittest tests.test_cpu_shortlist_retrieval tests.test_cuda_shortlist_retrieval -v
          if ($LASTEXITCODE) { throw 'Shortlist tests failed' }
      - name: Smoke test clean installed package
        shell: pwsh
        run: |
          $manifest = Get-Content package-output/package-manifest.json | ConvertFrom-Json
          python tests/windows_package_smoke.py (Join-Path package-output $manifest.setup_file) $manifest.version
      - name: Check output digest
        shell: pwsh
        run: |
          $manifest = Get-Content package-output/package-manifest.json | ConvertFrom-Json
          $actual = (Get-FileHash (Join-Path package-output $manifest.setup_file) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.sha256) { throw 'Manifest hash mismatch' }
      # A reviewed main-only manual run can preserve this run's installers.
      # Routine PR and push CI only build and smoke test them.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_artifacts == true
        with:
          name: ngr-windows-${{ matrix.flavor }}
          path: package-output/*
          if-no-files-found: error

  verify_artifacts:
    name: Verify published Windows artifacts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_artifacts == true
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: ngr-windows-*
          path: package-artifacts
          merge-multiple: false
      - name: Verify matching version and SHA-256 for both installers
        run: python packaging/windows/verify_artifacts.py package-artifacts packaging/windows/release-version.txt
