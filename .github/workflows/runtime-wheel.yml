name: Runtime wheel

on:
  pull_request:

permissions:
  contents: read

jobs:
  optional-mcp-wheel:
    name: Installed wheel with optional MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional MCP dependency
        run: python -m pip install --disable-pip-version-check 'mcp>=2,<3'
      - name: Build and exercise isolated wheel
        run: python -m unittest tests.test_runtime_wheel -v
