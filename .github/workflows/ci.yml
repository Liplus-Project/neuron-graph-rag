name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Eval smoke test
        run: python -m neuron_graph_rag eval
  benchmark-versions:
    name: Benchmark reproducibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Real-corpus benchmark contract
        run: python -m unittest discover -s tests -p test_real_corpus_benchmark.py -v
  mcp:
    name: Optional MCP adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP extra
        run: python -m pip install --disable-pip-version-check -e '.[mcp]'
      - name: MCP protocol tests
        run: python -m unittest tests.test_feedback_ledger tests.test_mcp_adapter -v
