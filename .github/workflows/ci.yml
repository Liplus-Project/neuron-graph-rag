name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Source-grounded v3 whole-module lifecycle gate
        run: python tools/probe_source_grounded_relation_observation_v3.py --root .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Eval smoke test
        run: python -m neuron_graph_rag eval
  mcp:
    name: Optional MCP adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP extra
        run: python -m pip install --disable-pip-version-check -e '.[mcp]'
      - name: MCP protocol tests
        run: python -m unittest tests.test_feedback_ledger tests.test_mcp_adapter tests.test_real_task_shadow_v2 tests.test_real_task_shadow_v3 -v
