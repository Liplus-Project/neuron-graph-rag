[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-graph-rag"
version = "0.1.0"
description = "Transparent hybrid retrieval with typed graph activation and success feedback."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Liplus Project" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
neuron-graph-rag = "neuron_graph_rag.cli:main"
neuron-graph-rag-mcp = "neuron_graph_rag_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
